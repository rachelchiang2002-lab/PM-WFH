// ---- Firebase 匿名驗證（讓前端能拿到可以讀寫資料的憑證，而不是任何人拿到網址就能讀寫）----
let firebaseIdToken = null;
async function ensureFirebaseAuth(forceRefresh) {
  if (firebaseIdToken && !forceRefresh) return firebaseIdToken;
  const configured = FIREBASE_API_KEY && FIREBASE_API_KEY !== "YOUR_FIREBASE_WEB_API_KEY";
  if (!configured) return null; // 還沒設定金鑰時略過，退回原本（未鎖權限）的行為，不擋住使用
  try {
    const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}`, {
      method: "POST",
      body: JSON.stringify({ returnSecureToken: true })
    });
    const data = await res.json();
    if (data && data.idToken) { firebaseIdToken = data.idToken; return firebaseIdToken; }
  } catch (e) {
    console.error("Firebase 匿名驗證失敗", e);
  }
  return null;
}
function withAuth(url) {
  return firebaseIdToken ? `${url}${url.includes("?") ? "&" : "?"}auth=${firebaseIdToken}` : url;
}

// ---- 密碼雜湊工具（SHA-256 + 每人各自的 salt，密碼本身不會直接存放）----
function randomHex(byteLen) {
  const arr = new Uint8Array(byteLen);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function hashPassword(password, salt) {
  return sha256Hex(`${salt}:${password}`);
}
function isValidPassword(pw) {
  return typeof pw === "string" && pw.length >= 4 && pw.length <= 12;
}
function randomTempPassword() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // 避開容易混淆的 0/O/1/I
  let s = "";
  for (let i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
// 分機 -> 會員 id 的對照，依序嘗試兩種方式：

function findMemberIdByExt(ext) {
  for (const id of state.members) {
    if (state.memberData[id] && state.memberData[id].ext === ext) return id;
  }
  const entry = STAFF_DIRECTORY[ext];
  if (!entry) return null;
  for (const id of state.members) {
    const md = state.memberData[id];
    if (md && !md.ext && md.displayName === entry.name) return id;
  }
  return null;
}
async function sendResetEmail(email, name, tempPassword) {
  const configured = MAIL_ENDPOINT_URL && MAIL_ENDPOINT_URL !== "YOUR_APPS_SCRIPT_MAIL_URL_HERE";
  if (!configured) return false;
  try {
    const res = await fetch(MAIL_ENDPOINT_URL, {
      method: "POST",
      body: JSON.stringify({ secret: MAIL_SECRET, email, name, tempPassword })
    });
    const data = await res.json();
    return !!(data && data.ok);
  } catch (e) {
    console.error("sendResetEmail failed", e);
    return false;
  }
}

function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function pad2(n) { return String(n).padStart(2, "0"); }
function fmtDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function quarterOf(d) { return Math.floor(d.getMonth() / 3) + 1; }
function quarterKey(d) { return `${d.getFullYear()}-Q${quarterOf(d)}`; }
function quarterMonthRange(q) {
  const start = (q - 1) * 3;
  return [start, start + 2]; // 0-indexed month start/end
}
function statusLabel(status) {
  if (status === "wfh") return "居家";
  if (status === "business") return "公出";
  return "休假";
}

function statusWithTime(status, time) {
  if (time === "AM") return `上午${statusLabel(status)}`;
  if (time === "PM") return `下午${statusLabel(status)}`;
  if (time) return `${statusLabel(status)}（${time}）`;
  return statusLabel(status);
}

async function bootstrap() {
  await ensureFirebaseAuth();
  const liffConfigured = LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID_HERE";
  if (!liffConfigured) {
    state.liffError = "尚未設定 LIFF_ID，目前是測試模式，請用電腦版分機登入。部署到 LINE 後會自動改為自動登入。";
    renderLoginChoice();
    return;
  }
  if (!window.liff) {
    state.liffError = "LINE 登入元件載入失敗，請改用電腦版分機登入。";
    renderLoginChoice();
    return;
  }
  try {
    await Promise.race([
      liff.init({ liffId: LIFF_ID }),
      new Promise((_, reject) => setTimeout(() => reject(new Error("liff.init 逾時（可能是網路環境擋住連線）")), 5000))
    ]);
  } catch (e) {
    console.error("LIFF init failed", e);
    state.liffError = "LINE 登入初始化失敗或逾時，請改用電腦版分機登入。";
    renderLoginChoice();
    return;
  }
  if (liff.isLoggedIn()) {
    try {
      const profile = await Promise.race([
        liff.getProfile(),
        new Promise((_, reject) => setTimeout(() => reject(new Error("liff.getProfile 逾時")), 5000))
      ]);
      state.currentUserId = profile.userId;
      state.currentUserName = profile.displayName;
      state.currentUserPicture = profile.pictureUrl || "";
      state.liffReady = true;
    } catch (e) {
      console.error("liff.getProfile failed", e);
    }
    await loadAll();
    return;
  }
  // Not logged in yet — offer a choice instead of forcing an immediate LINE-login redirect,
  // so people who don't want to authorize LINE can still use the app.
  renderLoginChoice();
}

function renderLoginChoice() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div style="max-width:360px; margin:60px auto; text-align:center; padding:0 16px;">
      <h2 style="margin-bottom:6px; font-size:19px;">部門出勤總覽</h2>
      ${state.liffError ? `<div class="warn-banner" style="text-align:left;">${state.liffError}</div>` : ""}
      <p style="color:var(--muted); font-size:13.5px; margin-bottom:24px;">選擇登入方式</p>
      <button class="btn" id="line-login-btn" style="width:100%; margin-bottom:10px;">使用 LINE 登入</button>
      <button class="btn secondary" id="manual-login-btn" style="width:100%;">電腦版登入（分機＋密碼）</button>
    </div>
  `;
  document.getElementById("line-login-btn").onclick = () => { liff.login(); };
  document.getElementById("manual-login-btn").onclick = async () => { await enterWebLoginMode(); };
}

async function enterWebLoginMode() {
  state.liffReady = false;
  await loadAll();
  let savedId = null;
  try { savedId = localStorage.getItem("attendance_web_session_id"); } catch (e) {}
  if (savedId && state.members.includes(savedId) && state.memberData[savedId]) {
    state.currentUserId = savedId;
    state.currentUserName = state.memberData[savedId].displayName || savedId;
  }
  state.webLogin = { step: "ext", ext: "", matchedId: null, matchedName: "", error: "" };
  render();
}

  document.querySelectorAll("[data-pw-toggle]").forEach(el => {
    el.onclick = () => {
      const input = document.getElementById(el.dataset.pwToggle);
      if (!input) return;
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      el.textContent = show ? "🙈" : "👁";
    };
  });
}

// ---- 電腦版：分機 + 密碼登入畫面 ----

function bindWebLoginEvents() {
  bindPasswordToggles();
  const extInput = document.getElementById("web-ext-input");
  if (extInput) {
    extInput.oninput = (e) => { state.webLogin.ext = e.target.value.trim(); };
    extInput.onkeydown = (e) => { if (e.key === "Enter") handleExtSubmit(); };
    extInput.focus();
  }
  const nextBtn = document.getElementById("web-ext-next-btn");
  if (nextBtn) nextBtn.onclick = () => handleExtSubmit();

  const backChoice = document.getElementById("web-back-to-choice-btn");
  if (backChoice) backChoice.onclick = () => { renderLoginChoice(); };

  const backExt = document.getElementById("web-back-to-ext-btn");
  if (backExt) backExt.onclick = () => {
    state.webLogin = { step: "ext", ext: "", matchedId: null, matchedName: "", error: "" };
    render();
  };

  const setpwBtn = document.getElementById("web-setpw-confirm-btn");
  if (setpwBtn) setpwBtn.onclick = () => handleSetPasswordSubmit();

  const pwInput = document.getElementById("web-pw-input");
  if (pwInput) {
    pwInput.onkeydown = (e) => { if (e.key === "Enter") handlePasswordSubmit(); };
    pwInput.focus();
  }
  const pwLoginBtn = document.getElementById("web-pw-login-btn");
  if (pwLoginBtn) pwLoginBtn.onclick = () => handlePasswordSubmit();

  const forgotLink = document.getElementById("web-forgot-link");
  if (forgotLink) forgotLink.onclick = (e) => { e.preventDefault(); state.webLogin.step = "forgot"; state.webLogin.error = ""; render(); };

  const forgotSendBtn = document.getElementById("web-forgot-send-btn");
  if (forgotSendBtn) forgotSendBtn.onclick = () => handleForgotSubmit();
}

async function handleExtSubmit() {
  const ext = state.webLogin.ext.trim();
  if (!ext) {
    state.webLogin.error = "請輸入分機號碼。";
    render();
    return;
  }
  const id = findMemberIdByExt(ext);
  if (!id) {
    // 不管這支分機有沒有在 STAFF_DIRECTORY 清單裡，只要找不到已經認領過這支分機的人，
    // 一律引導去用 LINE 登入並自行登記（這樣新人加入也不需要改程式碼）。
    state.webLogin.step = "blocked";
    state.webLogin.error = "";
    render();
    return;
  }
  state.webLogin.matchedId = id;
  state.webLogin.matchedName = state.memberData[id].displayName || ext;
  state.webLogin.error = "";
  const hasPw = !!state.memberData[id].passwordHash;
  state.webLogin.step = hasPw ? "password" : "setpw";
  render();
}

async function handleSetPasswordSubmit() {
  const pw1 = document.getElementById("web-setpw-1").value;
  const pw2 = document.getElementById("web-setpw-2").value;
  if (!isValidPassword(pw1)) {
    state.webLogin.error = "密碼長度需為 4～12 碼。";
    render();
    return;
  }
  if (pw1 !== pw2) {
    state.webLogin.error = "兩次輸入的密碼不一致。";
    render();
    return;
  }
  const id = state.webLogin.matchedId;
  const ext = state.webLogin.ext;
  const salt = randomHex(8);
  const hash = await hashPassword(pw1, salt);
  state.memberData[id].passwordSalt = salt;
  state.memberData[id].passwordHash = hash;
  state.memberData[id].ext = ext;
  await saveAll();
  completeWebLogin(id);
}

async function handlePasswordSubmit() {
  const id = state.webLogin.matchedId;
  const d = state.memberData[id];
  const pw = document.getElementById("web-pw-input").value;
  const hash = await hashPassword(pw, d.passwordSalt);
  if (hash !== d.passwordHash) {
    state.webLogin.error = "密碼錯誤，請再試一次。";
    render();
    return;
  }
  if (!d.ext) { d.ext = state.webLogin.ext; await saveAll(); }
  completeWebLogin(id);
}

function completeWebLogin(id) {
  state.currentUserId = id;
  state.currentUserName = state.memberData[id].displayName || id;
  state.liffReady = false;
  try { localStorage.setItem("attendance_web_session_id", id); } catch (e) {}
  state.webLogin = { step: "ext", ext: "", matchedId: null, matchedName: "", error: "" };
  render();
}

async function handleForgotSubmit() {
  const ext = state.webLogin.ext;
  const id = state.webLogin.matchedId;
  const d = id ? state.memberData[id] : null;
  const entry = STAFF_DIRECTORY[ext];
  const email = (d && d.email) || (entry && entry.email);
  const name = (d && d.displayName) || (entry && entry.name) || "";
  if (!email) {
    state.webLogin.error = "查無對應的 Email，請聯絡管理者協助重設。";
    render();
    return;
  }
  const tempPw = randomTempPassword();
  const salt = randomHex(8);
  const hash = await hashPassword(tempPw, salt);
  state.memberData[id].passwordSalt = salt;
  state.memberData[id].passwordHash = hash;
  await saveAll();
  const ok = await sendResetEmail(email, name, tempPw);
  if (!ok) {
    state.webLogin.error = "密碼已重設，但信件寄送失敗，請直接聯絡管理者取得新密碼，或確認網路連線後再試一次。";
    render();
    return;
  }
  state.webLogin.step = "forgot-sent";
  state.webLogin.error = "";
  render();
}

async function loadAll() {
  try {
    const data = await loadRemoteData();
    state.members = data.members || [];
    state.memberData = data.memberData || {};
    state.loadError = null;
  } catch (e) {
    console.error("load failed", e);
    state.members = [];
    state.memberData = {};
    state.loadError = "讀取雲端資料失敗，目前顯示的可能不是最新資料。錯誤：" + e.message;
  }
  for (const id of state.members) {
    if (!state.memberData[id]) state.memberData[id] = { displayName: id, quarterlyWFH: {}, overrides: {} };
    if (!state.memberData[id].quarterlyWFH) state.memberData[id].quarterlyWFH = {};
    if (!state.memberData[id].overrides) state.memberData[id].overrides = {};
  }

  // If LIFF identified the user but they're not registered yet, add them.
  // (We only set displayName on first creation — after that the person can
  // customize it in 我的設定 and it won't be silently overwritten by LINE profile.)
  if (state.liffReady && state.currentUserId && !state.members.includes(state.currentUserId)) {
    state.members.push(state.currentUserId);
    state.memberData[state.currentUserId] = { displayName: state.currentUserName, quarterlyWFH: {}, overrides: {} };
    await saveAll();
  }

  state.loaded = true;
  render();
}

async function loadRemoteData() {
  await ensureFirebaseAuth();
  let res = await fetch(withAuth(FIREBASE_URL));
  if (res.status === 401) {
    // token expired or not yet obtained — refresh once and retry
    await ensureFirebaseAuth(true);
    res = await fetch(withAuth(FIREBASE_URL));
  }
  if (!res.ok) throw new Error("firebase load failed: " + res.status);
  const data = await res.json();
  return (data && data.members) ? data : { members: [], memberData: {} };
}

async function saveAll() {
  if (state.loadError) {
    // We don't trust our in-memory copy of the data right now (the last read
    // from the cloud failed), so refuse to write — writing could permanently
    // overwrite good server-side data with an incomplete local snapshot.
    state.saveError = "剛剛讀取雲端資料時失敗，為了避免覆蓋掉正確的資料，這次操作暫時沒有存檔。請重新整理頁面，確認資料正常讀取後再試一次。";
    return;
  }
  try {
    await ensureFirebaseAuth();
    const body = JSON.stringify({ members: state.members, memberData: state.memberData });
    let res = await fetch(withAuth(FIREBASE_URL), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body
    });
    if (res.status === 401) {
      await ensureFirebaseAuth(true);
      res = await fetch(withAuth(FIREBASE_URL), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body
      });
    }
    if (!res.ok) {
      const errBody = await res.text().catch(() => "");
      console.error("save failed", res.status, errBody);
      state.saveError = `儲存失敗（狀態碼 ${res.status}），資料可能沒有真的存到雲端。請截圖這則訊息回報。`;
    } else {
      state.saveError = null;
    }
  } catch (e) {
    console.error("save failed", e);
    state.saveError = "儲存失敗（連線錯誤），資料可能沒有真的存到雲端：" + e.message;
  }
}

function getStatus(id, dateStr, weekday, dateObj) {
  if (HOLIDAYS[dateStr]) return null; // 國定假日不上班，不顯示任何個人登記
  const d = state.memberData[id];
  if (!d) return null;
  if (d.overrides && d.overrides[dateStr] !== undefined) {
    const v = d.overrides[dateStr];
    const status = typeof v === "object" ? v.status : v;
    return status === "office" ? null : status;
  }
  const qKey = quarterKey(dateObj);
  if (d.quarterlyWFH && d.quarterlyWFH[qKey] && d.quarterlyWFH[qKey].includes(weekday)) return "wfh";
  return null;
}

function getOverrideTime(id, dateStr) {
  const d = state.memberData[id];
  const v = d && d.overrides && d.overrides[dateStr];
  if (v && typeof v === "object" && v.time) return v.time;
  return null;
}

async function updateDisplayName(id, name) {
  name = name.trim();
  if (!name) return;
  state.memberData[id].displayName = name;
  if (id === state.currentUserId) state.currentUserName = name;
  render();
  await saveAll();
  render();
}

async function toggleQuarterlyDay(id, year, quarter, wd) {
  const key = `${year}-Q${quarter}`;
  const d = state.memberData[id];
  if (!d.quarterlyWFH) d.quarterlyWFH = {};
  const arr = d.quarterlyWFH[key] ? [...d.quarterlyWFH[key]] : [];
  const idx = arr.indexOf(wd);
  if (idx >= 0) {
    arr.splice(idx, 1);
    state.quotaWarning = false;
  } else {
    if (arr.length >= 2) {
      state.quotaWarning = true;
      render();
      alert("每週最多只能選 2 天居家。這一季已經選了 2 天，如果要換成別天，請先點掉其中一天，再選新的。");
      return;
    }
    arr.push(wd);
    state.quotaWarning = false;
  }
  if (arr.length === 0) delete d.quarterlyWFH[key];
  else d.quarterlyWFH[key] = arr;
  render();
  await saveAll();
  render();
}

function buildRangeOverrides_(d, startStr, endStr, startTime, endTime, period, status) {
  const end = endStr || startStr;
  const hasTime = !!(startTime && endTime);
  const isSingleDay = end === startStr;
  let cur = new Date(startStr + "T00:00:00");
  const last = new Date(end + "T00:00:00");
  if (cur > last) return;
  while (cur <= last) {
    const dateStr = fmtDate(cur);
    let value;
    if (!hasTime) {
      value = status; // full day, no time info
    } else if (isSingleDay) {
      const timeVal = period === "am" ? "AM" : period === "pm" ? "PM" : `${startTime}-${endTime}`;
      value = { status, time: timeVal };
    } else if (dateStr === startStr) {
      value = { status, time: `${startTime}起` }; // first day: from this time onward
    } else if (dateStr === end) {
      value = { status, time: `至${endTime}` }; // last day: up until this time
    } else {
      value = status; // days in between are full days
    }
    d.overrides[dateStr] = value;
    cur.setDate(cur.getDate() + 1);
  }
}

async function addLeaveRange(id, startStr, endStr, startTime, endTime, period) {
  if (!startStr) return;
  const d = state.memberData[id];
  buildRangeOverrides_(d, startStr, endStr, startTime, endTime, period, "leave");
  state.leaveStart = ""; state.leaveEnd = ""; state.leaveStartTime = ""; state.leaveEndTime = ""; state.leavePeriod = null;

function upcomingEntries(id, daysAhead) {
  daysAhead = daysAhead || 90;
  const results = [];
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  for (let i = 0; i < daysAhead; i++) {
    const dt = new Date(start);
    dt.setDate(start.getDate() + i);
    const dateStr = fmtDate(dt);
    const status = getStatus(id, dateStr, dt.getDay(), dt);
    if (status) results.push({ date: dateStr, status, time: getOverrideTime(id, dateStr) });
  }
  return results;
}

function cancelledWfhEntries(id, daysAhead) {
  daysAhead = daysAhead || 90;
  const d = state.memberData[id];
  if (!d) return [];
  const results = [];
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  for (let i = 0; i < daysAhead; i++) {
    const dt = new Date(start);
    dt.setDate(start.getDate() + i);
    const dateStr = fmtDate(dt);
    if (HOLIDAYS[dateStr]) continue; // national holiday, no work day to restore to
    const v = d.overrides && d.overrides[dateStr];
    if (v === undefined) continue;
    const ovStatus = typeof v === "object" ? v.status : v;
    if (ovStatus !== "office") continue; // only care about entries currently forced to "office"
    const qKey = quarterKey(dt);
    const wouldBeWfh = d.quarterlyWFH && d.quarterlyWFH[qKey] && d.quarterlyWFH[qKey].includes(dt.getDay());
    if (wouldBeWfh) results.push({ date: dateStr });
  }
  return results;
}

function render() {
  const app = document.getElementById("app");
  if (!state.loaded) { app.innerHTML = '<div class="loading">載入中…</div>'; return; }
  if (!state.liffReady && !state.currentUserId) { renderWebLoginGate(); return; }

  const canLogout = !state.liffReady && !!state.currentUserId;
  const whoamiHtml = state.currentUserId
    ? `<div class="whoami">${state.currentUserPicture ? `<img src="${state.currentUserPicture}">` : ""}<span>${state.currentUserName}</span>${canLogout ? `<button class="btn danger" id="top-logout-btn" style="padding:4px 10px; font-size:12px; min-height:auto;">登出</button>` : ""}</div>`
    : "";

  const html = `
    <header class="top">
      <div>
        <h1>部門出勤總覽</h1>
      </div>
      ${whoamiHtml}
    </header>
    ${state.liffError ? `<div class="warn-banner">${state.liffError}</div>` : ""}
    ${state.loadError ? `<div class="warn-banner">${state.loadError}</div>` : ""}
    ${state.saveError ? `<div class="warn-banner">${state.saveError}</div>` : ""}
    <div class="tabs">
      <div class="tab ${state.tab === 'calendar' ? 'active' : ''}" data-tab="calendar">月曆總覽</div>
      <div class="tab ${state.tab === 'settings' ? 'active' : ''}" data-tab="settings">我的設定</div>
    </div>
    ${state.tab === "calendar" ? renderCalendarTab() : renderSettingsTab()}
  `;
  app.innerHTML = html;
  bindEvents();
}

function renderCalendarTab() {
  const toggle = `
    <div class="view-toggle">
      <button class="view-btn ${state.calView === 'today' ? 'active' : ''}" data-view="today">今天</button>
      <button class="view-btn ${state.calView === 'month' ? 'active' : ''}" data-view="month">整月</button>
    </div>
  `;
  return toggle + (state.calView === "today" ? renderTodayCard() : renderMonthView());
}

function renderTodayCard() {
  const dt = state.dayCursor;
  const dateStr = fmtDate(dt);
  const wd = dt.getDay();
  const holiday = holidayName(dateStr);
  const rows = [];
  for (const id of state.members) {
    const status = getStatus(id, dateStr, wd, dt);
    if (status) rows.push({ id, name: state.memberData[id]?.displayName || id, status });
  }
  const wdLabel = WD_LABELS[WD_JS_ORDER.indexOf(wd)];
  const todayStr = fmtDate(new Date());
  const isToday = dateStr === todayStr;
  const label = `${dt.getMonth() + 1}月${dt.getDate()}日（週${wdLabel}）`;
  return `
    <div class="card">
      <div class="cal-head">
        <button data-daynav="-1">‹</button>
        <div class="today-date" style="margin-bottom:0;">${isToday ? '今天・' : ''}${label}</div>
        <button data-daynav="1">›</button>
      </div>
      ${holiday
        ? `<div class="holiday-note">國定假日：${holiday}，不上班</div>`
        : rows.length === 0
          ? '<div class="empty-note">這天大家都在辦公室。</div>'
          : rows.map(r => `
            <div class="detail-row">
              <span class="status-dot ${r.status}"></span>
              <span>${r.name}${statusWithTime(r.status, getOverrideTime(r.id, dateStr))}</span>
              ${r.id === state.currentUserId ? `<button class="btn danger cancel-btn" data-cancel-date="${dateStr}">取消</button>` : ''}
            </div>`).join("")}
      ${state.members.length === 0 ? '<div class="hint" style="margin-top:10px;">目前還沒有人登記，請到「我的設定」設定居家日。</div>' : ''}
    </div>
  `;
}

function renderMonthView() {
  const y = state.monthCursor.getFullYear();
  const m = state.monthCursor.getMonth();
  const monthLabel = `${y}年${m + 1}月`;
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayStr = fmtDate(new Date());

  const weekdayDates = [];
  for (let day = 1; day <= daysInMonth; day++) {
    const dt = new Date(y, m, day);
    const wd = dt.getDay();
    if (wd >= 1 && wd <= 5) weekdayDates.push(dt); // Mon..Fri only
  }

  let cells = "";
  const leading = weekdayDates.length > 0 ? weekdayDates[0].getDay() - 1 : 0; // Mon=1 -> 0 blanks .. Fri=5 -> 4 blanks
  for (let i = 0; i < leading; i++) cells += `<div class="day-cell dim"></div>`;

  for (const dt of weekdayDates) {
    const dateStr = fmtDate(dt);
    const wd = dt.getDay();
    const holiday = holidayName(dateStr);
    let chips = "";
    if (holiday) {
      chips = `<span class="chip holiday">${holiday}</span>`;
    } else {
      for (const id of state.members) {
        const status = getStatus(id, dateStr, wd, dt);
        if (status) {
          const displayName = state.memberData[id]?.displayName || id;
          chips += `<span class="chip ${status}">${displayName}</span>`;
        }
      }
    }
    cells += `
      <div class="day-cell ${dateStr === todayStr ? 'today' : ''}" data-day="${dateStr}">
        <div class="day-num">${dt.getDate()}</div>
        <div class="chips">${chips}</div>
      </div>`;
  }
  const totalCells = leading + weekdayDates.length;
  const trailing = (5 - (totalCells % 5)) % 5;
  for (let i = 0; i < trailing; i++) cells += `<div class="day-cell dim"></div>`;

  const wdHeaders = ["一", "二", "三", "四", "五"].map(l => `<div class="wd-label">週${l}</div>`).join("");
  const detail = state.selectedDay ? renderDayDetail(state.selectedDay) : "";

  return `
    <div class="card">
      <div class="cal-head">
        <button data-nav="-1">‹</button>
        <div class="month-label">${monthLabel}</div>
        <button data-nav="1">›</button>
      </div>
      <div class="legend">
        <span><span class="dot wfh"></span>居家辦公</span>
        <span><span class="dot leave"></span>休假</span>
        <span><span class="dot business"></span>公出</span>
      </div>
      <div class="grid5">${wdHeaders}</div>
      <div class="grid5" style="margin-top:4px;">${cells}</div>
      ${state.members.length === 0 ? '<div class="hint" style="margin-top:10px;">目前還沒有人登記，請到「我的設定」設定居家日。</div>' : ''}
    </div>
    ${detail}
  `;
}

function renderDayDetail(dateStr) {
  const dt = new Date(dateStr + "T00:00:00");
  const wd = dt.getDay();
  const holiday = holidayName(dateStr);
  const rows = [];
  for (const id of state.members) {
    const status = getStatus(id, dateStr, wd, dt);
    if (status) rows.push({ id, name: state.memberData[id]?.displayName || id, status });
  }
  const label = `${dt.getMonth() + 1}月${dt.getDate()}日`;
  return `
    <div class="card">
      <div class="detail-title">${label} 詳情</div>
      ${holiday
        ? `<div class="holiday-note">國定假日：${holiday}，不上班</div>`
        : rows.length === 0
          ? '<div class="empty-note">這天大家都在辦公室。</div>'
          : rows.map(r => `
            <div class="detail-row">
              <span class="status-dot ${r.status}"></span>
              <span>${r.name}${statusWithTime(r.status, getOverrideTime(r.id, dateStr))}</span>
              ${r.id === state.currentUserId ? `<button class="btn danger cancel-btn" data-cancel-date="${dateStr}">取消</button>` : ''}
            </div>`).join("")}
    </div>
  `;
}

// 以顯示名稱比對 STAFF_DIRECTORY，找出這個人原本就有的分機／Email（Excel 裡既有的資料），

function staffDirectoryLookupByName(displayName) {
  for (const [ext, entry] of Object.entries(STAFF_DIRECTORY)) {

}

async function handleSaveWebAccess() {
  const id = state.currentUserId;
  const email = document.getElementById("web-access-email").value.trim();
  const ext = document.getElementById("web-access-ext").value.trim();
  state.webAccessSuccess = false;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    state.webAccessError = "Email 格式不正確。";
    render();
    return;
  }
  if (!/^[0-9]{2,6}$/.test(ext)) {
    state.webAccessError = "分機號碼請輸入數字。";
    render();
    return;
  }
  const clash = state.members.find(mid => mid !== id && state.memberData[mid] && state.memberData[mid].ext === ext);
  if (clash) {
    state.webAccessError = `分機 ${ext} 已經被「${state.memberData[clash].displayName || clash}」登記過了，請確認號碼是否正確。`;
    render();
    return;
  }
  state.memberData[id].ext = ext;
  state.memberData[id].email = email;
  state.webAccessError = "";
  state.webAccessSuccess = true;
  render();
  await saveAll();
  render();
}

      ${state.changePwSuccess ? `<div class="hint" style="color:var(--wfh); font-weight:600;">密碼已更新</div>` : ""}
      ${pwFieldHtml("change-pw-old", "目前密碼")}
      ${pwFieldHtml("change-pw-new1", "新密碼（4～12碼）", "margin-top:8px;")}
      ${pwFieldHtml("change-pw-new2", "再輸入一次新密碼", "margin-top:8px;")}
      <button class="btn secondary" id="change-pw-btn" style="width:100%; margin-top:10px;">更新密碼</button>
    </div>
  `;
}

async function handleChangePassword() {
  const id = state.currentUserId;
  const d = state.memberData[id];
  const oldPw = document.getElementById("change-pw-old").value;
  const new1 = document.getElementById("change-pw-new1").value;
  const new2 = document.getElementById("change-pw-new2").value;
  state.changePwSuccess = false;
  const oldHash = await hashPassword(oldPw, d.passwordSalt);
  if (oldHash !== d.passwordHash) {
    state.changePwError = "目前密碼不正確。";
    render();
    return;
  }
  if (!isValidPassword(new1)) {
    state.changePwError = "新密碼長度需為 4～12 碼。";
    render();
    return;
  }
  if (new1 !== new2) {
    state.changePwError = "兩次輸入的新密碼不一致。";
    render();
    return;
  }
  const salt = randomHex(8);
  d.passwordSalt = salt;
  d.passwordHash = await hashPassword(new1, salt);
  state.changePwError = "";
  state.changePwSuccess = true;
  render();
  await saveAll();
  render();
}

async function removeMember(id) {
  const name = state.memberData[id]?.displayName || id;
  if (!confirm(`確定要移除「${name}」的所有資料嗎？此動作無法復原。`)) return;
  const pwd = prompt("請輸入管理密碼以確認移除：");
  if (pwd === null) return; // cancelled
  if (pwd !== "70817744") {
    alert("密碼錯誤，未執行移除。");
    return;
  }
  state.members = state.members.filter(m => m !== id);
  delete state.memberData[id];
  if (state.currentUserId === id) {
    state.currentUserId = "";
    state.currentUserName = "";
    try { localStorage.removeItem("attendance_web_session_id"); } catch (e) {}
  }
  render();
  await saveAll();
  render();
}

function bindEvents() {
  bindPasswordToggles();
  document.querySelectorAll(".tab").forEach(el => {
    el.onclick = () => { state.tab = el.dataset.tab; state.selectedDay = null; render(); };
  });
  document.querySelectorAll("[data-view]").forEach(el => {
    el.onclick = () => {
      state.calView = el.dataset.view;
      if (el.dataset.view === "today") state.dayCursor = startOfDay(new Date());
      state.selectedDay = null;
      render();
    };
  });
  document.querySelectorAll("[data-daynav]").forEach(el => {
    el.onclick = () => {
      const dir = parseInt(el.dataset.daynav, 10);
      const next = new Date(state.dayCursor);
      next.setDate(next.getDate() + dir);
      state.dayCursor = next;
      render();
    };
  });
  document.querySelectorAll("[data-nav]").forEach(el => {
    el.onclick = () => {
      const dir = parseInt(el.dataset.nav, 10);
      state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth() + dir, 1);
      state.selectedDay = null;
      render();
    };
  });
  document.querySelectorAll("[data-day]").forEach(el => {
    el.onclick = () => {
      state.selectedDay = state.selectedDay === el.dataset.day ? null : el.dataset.day;
      render();
    };
  });

  const changePwBtn = document.getElementById("change-pw-btn");
  if (changePwBtn) changePwBtn.onclick = () => handleChangePassword();

  const saveWebAccessBtn = document.getElementById("save-web-access-btn");
  if (saveWebAccessBtn) saveWebAccessBtn.onclick = () => handleSaveWebAccess();

  const logoutBtn = document.getElementById("top-logout-btn");
  if (logoutBtn) logoutBtn.onclick = () => {
    try { localStorage.removeItem("attendance_web_session_id"); } catch (e) {}
    state.currentUserId = "";
    state.currentUserName = "";
    state.webLogin = { step: "ext", ext: "", matchedId: null, matchedName: "", error: "" };
    render();
  };

  document.querySelectorAll("[data-wd]").forEach(el => {
    el.onclick = async () => {
      await toggleQuarterlyDay(state.currentUserId, state.settingsYear, state.settingsQuarter, parseInt(el.dataset.wd, 10));
    };
  });

  const nameInput = document.getElementById("display-name-input");
  const saveNameBtn = document.getElementById("save-name-btn");
  if (saveNameBtn) {
    saveNameBtn.onclick = async () => { await updateDisplayName(state.currentUserId, nameInput.value); };
  }

  const yearSelect = document.getElementById("settings-year-select");
  if (yearSelect) {
    yearSelect.onchange = (e) => { state.settingsYear = parseInt(e.target.value, 10); state.quotaWarning = false; render(); };
  }
  document.querySelectorAll("[data-quarter]").forEach(el => {
    el.onclick = () => { state.settingsQuarter = parseInt(el.dataset.quarter, 10); state.quotaWarning = false; render(); };
  });
  document.querySelectorAll("[data-clear-quarter]").forEach(el => {
    el.onclick = async () => { await clearQuarter(state.currentUserId, el.dataset.clearQuarter); };
  });

  const leaveStart = document.getElementById("leave-start");
  const leaveEnd = document.getElementById("leave-end");
  if (leaveStart) leaveStart.oninput = (e) => { state.leaveStart = e.target.value; };
  if (leaveEnd) leaveEnd.oninput = (e) => { state.leaveEnd = e.target.value; };
  document.querySelectorAll("[data-time-preset]").forEach(el => {
    el.onclick = () => {
      const preset = el.dataset.timePreset;
      const target = el.dataset.timeTarget;
      const times = preset === "am" ? ["09:00", "12:00"] : preset === "pm" ? ["13:00", "18:00"] : ["", ""];
      const period = preset === "am" ? "am" : preset === "pm" ? "pm" : null;
      if (target === "business") {
        state.businessStartTime = times[0]; state.businessEndTime = times[1]; state.businessPeriod = period;
      } else {
        state.leaveStartTime = times[0]; state.leaveEndTime = times[1]; state.leavePeriod = period;
      }
      render();
    };
  });

  const leaveStartTime = document.getElementById("leave-start-time");
  const leaveEndTime = document.getElementById("leave-end-time");
  if (leaveStartTime) leaveStartTime.oninput = (e) => { state.leaveStartTime = e.target.value; state.leavePeriod = null; };
  if (leaveEndTime) leaveEndTime.oninput = (e) => { state.leaveEndTime = e.target.value; state.leavePeriod = null; };
  const addLeaveBtn = document.getElementById("add-leave-btn");
  if (addLeaveBtn) {
    addLeaveBtn.onclick = async () => {
      await addLeaveRange(state.currentUserId, state.leaveStart, state.leaveEnd, state.leaveStartTime, state.leaveEndTime, state.leavePeriod);
    };
  }

  const businessStart = document.getElementById("business-start");
  const businessEnd = document.getElementById("business-end");
  if (businessStart) businessStart.oninput = (e) => { state.businessStart = e.target.value; };
  if (businessEnd) businessEnd.oninput = (e) => { state.businessEnd = e.target.value; };
  const businessStartTime = document.getElementById("business-start-time");
  const businessEndTime = document.getElementById("business-end-time");
  if (businessStartTime) businessStartTime.oninput = (e) => { state.businessStartTime = e.target.value; state.businessPeriod = null; };
  if (businessEndTime) businessEndTime.oninput = (e) => { state.businessEndTime = e.target.value; state.businessPeriod = null; };
  const addBusinessBtn = document.getElementById("add-business-btn");
  if (addBusinessBtn) {
    addBusinessBtn.onclick = async () => {
      await addBusinessRange(state.currentUserId, state.businessStart, state.businessEnd, state.businessStartTime, state.businessEndTime, state.businessPeriod);
    };
  }

  document.querySelectorAll("[data-cancel-date]").forEach(el => {
    el.onclick = async () => { await cancelDate(state.currentUserId, el.dataset.cancelDate); };
  });

  document.querySelectorAll("[data-restore-date]").forEach(el => {
    el.onclick = async () => { await restoreWfh(state.currentUserId, el.dataset.restoreDate); };
  });

  document.querySelectorAll("[data-remove-member]").forEach(el => {
    el.onclick = async () => { await removeMember(el.dataset.removeMember); };
  });
}

bootstrap();
</script>
