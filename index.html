<script>
  const LIFF_ID = "2011478484-krfYEfBj"; // 例如 "1234567890-AbCdEfGh"
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwP4b4C7UzWUuQ9bbuEBlW52pOsRY6J_YyIOalP8wyIDoqr31EIq68RuqIEs_i7MvxZ/exec"; // 部署 Apps Script 後拿到的 /exec 網址

<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --border: #e3e6eb;
    --wfh: #2f6f6b;
    --wfh-bg: #e4f0ef;
    --leave: #c1731f;
    --leave-bg: #f7e9db;
    --business: #5c6bc0;
    --business-bg: #e8e9f7;
    --accent: #2f6f6b;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei",
      "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  #app { max-width: 880px; margin: 0 auto; padding: 16px 12px 60px; }
  @media (min-width: 600px) { #app { padding: 20px 16px 60px; } }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 8px;
  }
  header.top h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: 0.01em; }
  header.top .sub { font-size: 12.5px; color: var(--muted); }
  .whoami { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .whoami img { width: 20px; height: 20px; border-radius: 50%; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 12px 14px; font-size: 15px; font-weight: 600; color: var(--muted);
    cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; user-select: none;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  .view-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .view-btn {
    padding: 10px 16px; font-size: 14px; font-weight: 600; border-radius: 8px;
    border: 1px solid var(--border); background: #fff; color: var(--muted); cursor: pointer;
    min-height: 40px;
  }
  .view-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .today-date { font-size: 17px; font-weight: 700; margin-bottom: 12px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .card + .card { margin-top: 14px; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-head .month-label { font-size: 16px; font-weight: 700; }
  .cal-head button {
    border: 1px solid var(--border); background: var(--card); border-radius: 7px;
    width: 30px; height: 30px; cursor: pointer; font-size: 14px; color: var(--ink);
  }
  .cal-head button:hover { background: #f0f1f3; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .dot.wfh { background: var(--wfh); }
  .dot.leave { background: var(--leave); }
  .dot.business { background: var(--business); }

  .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wd-label { font-size: 10.5px; color: var(--muted); text-align: center; padding-bottom: 4px; font-weight: 600; }
  .day-cell {
    min-height: 44px; border: 1px solid var(--border); border-radius: 8px; padding: 5px 4px;
    background: #fff; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  }
  .day-cell.dim { background: #fafbfc; color: #c3c7cf; }
  .day-cell:hover { border-color: #c9ced7; }
  .day-cell.today { border-color: var(--accent); border-width: 1.5px; }
  .day-num { font-size: 11px; font-weight: 700; }
  .day-cell.dim .day-num { color: #b9bec8; }
  .chips { display: flex; flex-direction: column; gap: 2px; }
  .chip {
    font-size: 9.5px; font-weight: 700; padding: 2px 4px; border-radius: 4px; line-height: 1.35;
    white-space: normal; word-break: break-word;
  }
  .chip.wfh { background: var(--wfh-bg); color: var(--wfh); }
  .chip.leave { background: var(--leave-bg); color: var(--leave); }
  .chip.business { background: var(--business-bg); color: var(--business); }
  .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }

  .detail-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .detail-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 19px; }
  .detail-row .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 5px; }
  .detail-row .cancel-btn { margin-left: auto; }
  .status-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.wfh { background: var(--wfh); }
  .status-dot.leave { background: var(--leave); }
  .status-dot.business { background: var(--business); }
  .empty-note { color: var(--muted); font-size: 13.5px; }

  label.field-label { font-size: 13px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 6px; }
  select, input[type="date"], input[type="text"] {
    font-family: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: #fff; color: var(--ink); min-height: 44px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .wd-toggle-row, .q-toggle-row { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .wd-toggle, .q-toggle {
    min-width: 44px; height: 44px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--muted);
  }
  .wd-toggle.on, .q-toggle.on { background: var(--wfh); border-color: var(--wfh); color: #fff; }
  .btn { border: none; background: var(--accent); color: #fff; padding: 11px 18px; border-radius: 8px; font-size: 14.5px; font-weight: 700; cursor: pointer; min-height: 44px; }
  .btn:hover { opacity: 0.92; }
  .btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--border); }
  .btn.leave-btn { background: var(--leave); }
  .btn.business-btn { background: var(--business); }
  .btn.danger { background: #fff; color: #b3412a; border: 1px solid #ecd2c8; padding: 7px 12px; font-size: 12.5px; min-height: 32px; }
  .quota { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
  .quota b { color: var(--ink); }
  .quota.warn { color: #b3412a; font-weight: 600; }

  .override-list { margin-top: 10px; }
  .override-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .override-item:last-child { border-bottom: none; }

  h3.section-h { font-size: 15px; margin: 0 0 10px; font-weight: 700; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .loading { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .warn-banner {
    background: #fdf3e7; border: 1px solid #f0dcb8; color: #8a5a12; font-size: 13px;
    padding: 10px 12px; border-radius: 8px; margin-bottom: 14px;
  }
  .quarter-summary { font-size: 13px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
</style>

<div id="app">
  <div class="loading">載入中…</div>
</div>

<script>
const WD_LABELS = ["一","二","三","四","五","六","日"]; // Mon..Sun columns
const WD_JS_ORDER = [1,2,3,4,5,6,0]; // corresponding JS getDay() values

let state = {
  loaded: false,
  liffReady: false,
  liffError: null,          // error message if LIFF init/login failed
  currentUserId: "",        // stable id (LINE userId, or typed name in fallback mode)
  currentUserName: "",      // display name
  currentUserPicture: "",   // avatar url (LIFF mode only)
  members: [],               // array of ids
  memberData: {},             // id -> {displayName, quarterlyWFH:{"2026-Q1":[wd,...]}, overrides:{}}
  tab: "calendar",
  calView: "today", // "today" | "month"
  dayCursor: startOfDay(new Date()),
  monthCursor: startOfMonth(new Date()),
  selectedDay: null,
  newUserInput: "",
  leaveStart: "",
  leaveEnd: "",
  leaveStartTime: "",
  leaveEndTime: "",
  businessStart: "",
  businessEnd: "",
  settingsYear: new Date().getFullYear(),
  settingsQuarter: Math.floor(new Date().getMonth() / 3) + 1,
  quotaWarning: false,
  saveError: null,
  loadError: null,
};

function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function pad2(n) { return String(n).padStart(2, "0"); }
function fmtDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function quarterOf(d) { return Math.floor(d.getMonth() / 3) + 1; }
function quarterKey(d) { return `${d.getFullYear()}-Q${quarterOf(d)}`; }
function quarterMonthRange(q) {
  const start = (q - 1) * 3;
  return [start, start + 2]; // 0-indexed month start/end
}
function statusLabel(status) {
  if (status === "wfh") return "居家";
  if (status === "business") return "公出";
  return "休假";
}

async function bootstrap() {
  const liffConfigured = LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID_HERE";
  if (liffConfigured && window.liff) {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return; // page will redirect through LINE login
      }
      const profile = await liff.getProfile();
      state.currentUserId = profile.userId;
      state.currentUserName = profile.displayName;
      state.currentUserPicture = profile.pictureUrl || "";
      state.liffReady = true;
    } catch (e) {
      console.error("LIFF init failed", e);
      state.liffError = "LINE 登入初始化失敗，暫時切換為手動選擇姓名模式。";
    }
  } else {
    state.liffError = liffConfigured
      ? null
      : "尚未設定 LIFF_ID，目前是測試模式，請手動輸入姓名。部署到 LINE 後會自動改為自動登入。";
  }
  await loadAll();
}

async function loadAll() {
  try {
    const data = await loadRemoteData();
    state.members = data.members || [];
    state.memberData = data.memberData || {};
    state.loadError = null;
  } catch (e) {
    console.error("load failed", e);
    state.members = [];
    state.memberData = {};
    state.loadError = "讀取雲端資料失敗，目前顯示的可能不是最新資料。錯誤：" + e.message;
  }
  for (const id of state.members) {
    if (!state.memberData[id]) state.memberData[id] = { displayName: id, quarterlyWFH: {}, overrides: {} };
    if (!state.memberData[id].quarterlyWFH) state.memberData[id].quarterlyWFH = {};
    if (!state.memberData[id].overrides) state.memberData[id].overrides = {};
  }

  // If LIFF identified the user but they're not registered yet, add them.
  // (We only set displayName on first creation — after that the person can
  // customize it in 我的設定 and it won't be silently overwritten by LINE profile.)
  if (state.liffReady && state.currentUserId && !state.members.includes(state.currentUserId)) {
    state.members.push(state.currentUserId);
    state.memberData[state.currentUserId] = { displayName: state.currentUserName, quarterlyWFH: {}, overrides: {} };
    await saveAll();
  }

  state.loaded = true;
  render();
}

async function loadRemoteData() {
  const res = await fetch(GAS_URL);
  if (!res.ok) throw new Error("google sheets load failed: " + res.status);
  const data = await res.json();
  return (data && data.members) ? data : { members: [], memberData: {} };
}

async function saveAll() {
  try {
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight to Apps Script
      body: JSON.stringify({ members: state.members, memberData: state.memberData })
    });
    if (!res.ok) {
      const body = await res.text().catch(() => "");
      console.error("save failed", res.status, body);
      state.saveError = `儲存失敗（狀態碼 ${res.status}），資料可能沒有真的存到雲端。請截圖這則訊息回報。`;
    } else {
      state.saveError = null;
    }
  } catch (e) {
    console.error("save failed", e);
    state.saveError = "儲存失敗（連線錯誤），資料可能沒有真的存到雲端：" + e.message;
  }
}

function getStatus(id, dateStr, weekday, dateObj) {
  const d = state.memberData[id];
  if (!d) return null;
  if (d.overrides && d.overrides[dateStr] !== undefined) {
    const v = d.overrides[dateStr];
    const status = typeof v === "object" ? v.status : v;
    return status === "office" ? null : status;
  }
  const qKey = quarterKey(dateObj);
  if (d.quarterlyWFH && d.quarterlyWFH[qKey] && d.quarterlyWFH[qKey].includes(weekday)) return "wfh";
  return null;
}

function getOverrideTime(id, dateStr) {
  const d = state.memberData[id];
  const v = d && d.overrides && d.overrides[dateStr];
  if (v && typeof v === "object" && v.time) return v.time;
  return null;
}

async function updateDisplayName(id, name) {
  name = name.trim();
  if (!name) return;
  state.memberData[id].displayName = name;
  if (id === state.currentUserId) state.currentUserName = name;
  render();
  await saveAll();
  render();
}

async function toggleQuarterlyDay(id, year, quarter, wd) {
  const key = `${year}-Q${quarter}`;
  const d = state.memberData[id];
  if (!d.quarterlyWFH) d.quarterlyWFH = {};
  const arr = d.quarterlyWFH[key] ? [...d.quarterlyWFH[key]] : [];
  const idx = arr.indexOf(wd);
  if (idx >= 0) {
    arr.splice(idx, 1);
    state.quotaWarning = false;
  } else {
    if (arr.length >= 2) {
      state.quotaWarning = true;
      render();
      alert("每週最多只能選 2 天居家。這一季已經選了 2 天，如果要換成別天，請先點掉其中一天，再選新的。");
      return;
    }
    arr.push(wd);
    state.quotaWarning = false;
  }
  if (arr.length === 0) delete d.quarterlyWFH[key];
  else d.quarterlyWFH[key] = arr;
  render();
  await saveAll();
  render();
}

async function clearQuarter(id, key) {
  delete state.memberData[id].quarterlyWFH[key];
  render();
  await saveAll();
  render();
}

async function cancelDate(id, dateStr) {
  state.memberData[id].overrides[dateStr] = "office";
  render();
  await saveAll();
  render();
}

async function restoreWfh(id, dateStr) {
  delete state.memberData[id].overrides[dateStr];
  render();
  await saveAll();
  render();
}

// ---- fallback manual registration (used only when LIFF isn't configured yet) ----
async function addManualMember(name) {
  name = name.trim();
  if (!name || state.members.includes(name)) return;
  state.members.push(name);
  state.memberData[name] = { displayName: name, quarterlyWFH: {}, overrides: {} };
  state.currentUserId = name;
  state.currentUserName = name;
  render();
  await saveAll();
  render();
}

async function addLeaveRange(id, startStr, endStr, startTime, endTime) {
  if (!startStr) return;
  const end = endStr || startStr;
  const d = state.memberData[id];
  const timeLabel = (startTime && endTime) ? `${startTime}-${endTime}` : null;
  let cur = new Date(startStr + "T00:00:00");
  const last = new Date(end + "T00:00:00");
  if (cur > last) return;
  while (cur <= last) {
    d.overrides[fmtDate(cur)] = timeLabel ? { status: "leave", time: timeLabel } : "leave";
    cur.setDate(cur.getDate() + 1);
  }
  state.leaveStart = ""; state.leaveEnd = ""; state.leaveStartTime = ""; state.leaveEndTime = "";
  render();
  await saveAll();
  render();
}

async function addBusinessRange(id, startStr, endStr) {
  if (!startStr) return;
  const end = endStr || startStr;
  const d = state.memberData[id];
  let cur = new Date(startStr + "T00:00:00");
  const last = new Date(end + "T00:00:00");
  if (cur > last) return;
  while (cur <= last) {
    d.overrides[fmtDate(cur)] = "business";
    cur.setDate(cur.getDate() + 1);
  }
  state.businessStart = ""; state.businessEnd = "";
  render();
  await saveAll();
  render();
}

async function removeOverride(id, dateStr) {
  delete state.memberData[id].overrides[dateStr];
  render();
  await saveAll();
  render();
}

function upcomingEntries(id, daysAhead) {
  daysAhead = daysAhead || 90;
  const results = [];
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  for (let i = 0; i < daysAhead; i++) {
    const dt = new Date(start);
    dt.setDate(start.getDate() + i);
    const dateStr = fmtDate(dt);
    const status = getStatus(id, dateStr, dt.getDay(), dt);
    if (status) results.push({ date: dateStr, status, time: getOverrideTime(id, dateStr) });
  }
  return results;
}

function cancelledWfhEntries(id, daysAhead) {
  daysAhead = daysAhead || 90;
  const d = state.memberData[id];
  if (!d) return [];
  const results = [];
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  for (let i = 0; i < daysAhead; i++) {
    const dt = new Date(start);
    dt.setDate(start.getDate() + i);
    const dateStr = fmtDate(dt);
    const v = d.overrides && d.overrides[dateStr];
    if (v === undefined) continue;
    const ovStatus = typeof v === "object" ? v.status : v;
    if (ovStatus !== "office") continue; // only care about entries currently forced to "office"
    const qKey = quarterKey(dt);
    const wouldBeWfh = d.quarterlyWFH && d.quarterlyWFH[qKey] && d.quarterlyWFH[qKey].includes(dt.getDay());
    if (wouldBeWfh) results.push({ date: dateStr });
  }
  return results;
}

function render() {
  const app = document.getElementById("app");
  if (!state.loaded) { app.innerHTML = '<div class="loading">載入中…</div>'; return; }

  const whoamiHtml = state.liffReady
    ? `<div class="whoami">${state.currentUserPicture ? `<img src="${state.currentUserPicture}">` : ""}${state.currentUserName}</div>`
    : "";

  const html = `
    <header class="top">
      <div>
        <h1>部門出勤總覽</h1>
      </div>
      ${whoamiHtml}
    </header>
    ${state.liffError ? `<div class="warn-banner">${state.liffError}</div>` : ""}
    ${state.loadError ? `<div class="warn-banner">${state.loadError}</div>` : ""}
    ${state.saveError ? `<div class="warn-banner">${state.saveError}</div>` : ""}
    <div class="tabs">
      <div class="tab ${state.tab === 'calendar' ? 'active' : ''}" data-tab="calendar">月曆總覽</div>
      <div class="tab ${state.tab === 'settings' ? 'active' : ''}" data-tab="settings">我的設定</div>
    </div>
    ${state.tab === "calendar" ? renderCalendarTab() : renderSettingsTab()}
  `;
  app.innerHTML = html;
  bindEvents();
}

function renderCalendarTab() {
  const toggle = `
    <div class="view-toggle">
      <button class="view-btn ${state.calView === 'today' ? 'active' : ''}" data-view="today">今天</button>
      <button class="view-btn ${state.calView === 'month' ? 'active' : ''}" data-view="month">整月</button>
    </div>
  `;
  return toggle + (state.calView === "today" ? renderTodayCard() : renderMonthView());
}

function renderTodayCard() {
  const dt = state.dayCursor;
  const dateStr = fmtDate(dt);
  const wd = dt.getDay();
  const rows = [];
  for (const id of state.members) {
    const status = getStatus(id, dateStr, wd, dt);
    if (status) rows.push({ id, name: state.memberData[id]?.displayName || id, status });
  }
  const wdLabel = WD_LABELS[WD_JS_ORDER.indexOf(wd)];
  const todayStr = fmtDate(new Date());
  const isToday = dateStr === todayStr;
  const label = `${dt.getMonth() + 1}月${dt.getDate()}日（週${wdLabel}）`;
  return `
    <div class="card">
      <div class="cal-head">
        <button data-daynav="-1">‹</button>
        <div class="today-date" style="margin-bottom:0;">${isToday ? '今天・' : ''}${label}</div>
        <button data-daynav="1">›</button>
      </div>
      ${rows.length === 0
        ? '<div class="empty-note">這天大家都在辦公室。</div>'
        : rows.map(r => `
          <div class="detail-row">
            <span class="status-dot ${r.status}"></span>
            <span>${r.name}${statusLabel(r.status)}${getOverrideTime(r.id, dateStr) ? `（${getOverrideTime(r.id, dateStr)}）` : ''}</span>
            ${r.id === state.currentUserId ? `<button class="btn danger cancel-btn" data-cancel-date="${dateStr}">取消</button>` : ''}
          </div>`).join("")}
      ${state.members.length === 0 ? '<div class="hint" style="margin-top:10px;">目前還沒有人登記，請到「我的設定」設定居家日。</div>' : ''}
    </div>
  `;
}

function renderMonthView() {
  const y = state.monthCursor.getFullYear();
  const m = state.monthCursor.getMonth();
  const monthLabel = `${y}年${m + 1}月`;
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayStr = fmtDate(new Date());

  const weekdayDates = [];
  for (let day = 1; day <= daysInMonth; day++) {
    const dt = new Date(y, m, day);
    const wd = dt.getDay();
    if (wd >= 1 && wd <= 5) weekdayDates.push(dt); // Mon..Fri only
  }

  let cells = "";
  const leading = weekdayDates.length > 0 ? weekdayDates[0].getDay() - 1 : 0; // Mon=1 -> 0 blanks .. Fri=5 -> 4 blanks
  for (let i = 0; i < leading; i++) cells += `<div class="day-cell dim"></div>`;

  for (const dt of weekdayDates) {
    const dateStr = fmtDate(dt);
    const wd = dt.getDay();
    let chips = "";
    for (const id of state.members) {
      const status = getStatus(id, dateStr, wd, dt);
      if (status) {
        const displayName = state.memberData[id]?.displayName || id;
        chips += `<span class="chip ${status}">${displayName}</span>`;
      }
    }
    cells += `
      <div class="day-cell ${dateStr === todayStr ? 'today' : ''}" data-day="${dateStr}">
        <div class="day-num">${dt.getDate()}</div>
        <div class="chips">${chips}</div>
      </div>`;
  }
  const totalCells = leading + weekdayDates.length;
  const trailing = (5 - (totalCells % 5)) % 5;
  for (let i = 0; i < trailing; i++) cells += `<div class="day-cell dim"></div>`;

  const wdHeaders = ["一", "二", "三", "四", "五"].map(l => `<div class="wd-label">週${l}</div>`).join("");
  const detail = state.selectedDay ? renderDayDetail(state.selectedDay) : "";

  return `
    <div class="card">
      <div class="cal-head">
        <button data-nav="-1">‹</button>
        <div class="month-label">${monthLabel}</div>
        <button data-nav="1">›</button>
      </div>
      <div class="legend">
        <span><span class="dot wfh"></span>居家辦公</span>
        <span><span class="dot leave"></span>休假</span>
        <span><span class="dot business"></span>公出</span>
      </div>
      <div class="grid5">${wdHeaders}</div>
      <div class="grid5" style="margin-top:4px;">${cells}</div>
      ${state.members.length === 0 ? '<div class="hint" style="margin-top:10px;">目前還沒有人登記，請到「我的設定」設定居家日。</div>' : ''}
    </div>
    ${detail}
  `;
}

function renderDayDetail(dateStr) {
  const dt = new Date(dateStr + "T00:00:00");
  const wd = dt.getDay();
  const rows = [];
  for (const id of state.members) {
    const status = getStatus(id, dateStr, wd, dt);
    if (status) rows.push({ id, name: state.memberData[id]?.displayName || id, status });
  }
  const label = `${dt.getMonth() + 1}月${dt.getDate()}日`;
  return `
    <div class="card">
      <div class="detail-title">${label} 詳情</div>
      ${rows.length === 0
        ? '<div class="empty-note">這天大家都在辦公室。</div>'
        : rows.map(r => `
          <div class="detail-row">
            <span class="status-dot ${r.status}"></span>
            <span>${r.name}${statusLabel(r.status)}${getOverrideTime(r.id, dateStr) ? `（${getOverrideTime(r.id, dateStr)}）` : ''}</span>
            ${r.id === state.currentUserId ? `<button class="btn danger cancel-btn" data-cancel-date="${dateStr}">取消</button>` : ''}
          </div>`).join("")}
    </div>
  `;
}

function renderSettingsTab() {
  // LIFF mode: identity is fixed, jump straight to settings for currentUserId
  if (state.liffReady && state.currentUserId) {
    return renderMemberSettings(state.currentUserId) + renderMemberManagement();
  }

  // Fallback mode: manual name entry / pick existing name
  if (!state.currentUserId || !state.members.includes(state.currentUserId)) {
    const memberOptions = state.members.map(id => `<option value="${id}">${state.memberData[id]?.displayName || id}</option>`).join("");
    return `
      <div class="card">
        <h3 class="section-h">（測試模式）選擇你的身分</h3>
        <div class="row">
          <div>
            <label class="field-label">你的姓名</label>
            <input type="text" id="new-user-input" placeholder="例如：王小明" value="${state.newUserInput}" />
          </div>
          <button class="btn" id="add-user-btn">加入名單</button>
        </div>
        ${state.members.length > 0 ? `
          <div style="margin-top:14px;">
            <label class="field-label">或選擇已存在的名字</label>
            <select id="pick-user-select">
              <option value="">請選擇</option>
              ${memberOptions}
            </select>
          </div>` : ""}
      </div>
    ` + renderMemberManagement();
  }
  return renderMemberSettings(state.currentUserId) + renderMemberManagement();
}

function renderMemberManagement() {
  if (state.members.length === 0) return "";
  return `
    <div class="card">
      <h3 class="section-h">成員管理</h3>
      <div class="hint">同仁離職後，可以在這裡把他的資料整個移除（無法復原）</div>
      <div class="override-list" style="margin-top:8px;">
        ${state.members.map(id => `
          <div class="override-item">
            <span>${state.memberData[id]?.displayName || id}</span>
            <button class="btn danger" data-remove-member="${id}">移除</button>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

async function removeMember(id) {
  const name = state.memberData[id]?.displayName || id;
  if (!confirm(`確定要移除「${name}」的所有資料嗎？此動作無法復原。`)) return;
  const pwd = prompt("請輸入管理密碼以確認移除：");
  if (pwd === null) return; // cancelled
  if (pwd !== "70817744") {
    alert("密碼錯誤，未執行移除。");
    return;
  }
  state.members = state.members.filter(m => m !== id);
  delete state.memberData[id];
  if (state.currentUserId === id) {
    state.currentUserId = "";
    state.currentUserName = "";
  }
  render();
  await saveAll();
  render();
}

function renderMemberSettings(id) {
  const d = state.memberData[id];
  const year = state.settingsYear;
  const quarter = state.settingsQuarter;
  const qKey = `${year}-Q${quarter}`;
  const selectedDays = (d.quarterlyWFH && d.quarterlyWFH[qKey]) || [];
  const [qStartM, qEndM] = quarterMonthRange(quarter);
  const qMonthsLabel = `${qStartM + 1}~${qEndM + 1}月`;

  const quarterSummaryEntries = Object.entries(d.quarterlyWFH || {}).sort();
  const upcoming = upcomingEntries(id, 90);
  const cancelledWfh = cancelledWfhEntries(id, 90);
  const yearOptions = [year, year + 1].map(y => `<option value="${y}" ${y === year ? "selected" : ""}>${y}</option>`).join("");

  return `
    <div class="card">
      <h3 class="section-h">顯示名稱</h3>
      <div class="row">
        <div>
          <label class="field-label">在行事曆上顯示的名字</label>
          <input type="text" id="display-name-input" value="${d.displayName}" />
        </div>
        <button class="btn secondary" id="save-name-btn">儲存</button>
      </div>
    </div>

    <div class="card">
      <h3 class="section-h">居家辦公申請（每季）</h3>
      <div class="hint">選好季度後勾選每週固定居家的星期，最多 2 天，該季（${qMonthsLabel}）就會自動套用</div>
      <div class="row" style="margin-top:10px;">
        <div>
          <label class="field-label">年度</label>
          <select id="settings-year-select">${yearOptions}</select>
        </div>
      </div>
      <div class="q-toggle-row" style="margin-top:10px;">
        ${[1, 2, 3, 4].map(q => `<button class="q-toggle ${q === quarter ? 'on' : ''}" data-quarter="${q}">Q${q}</button>`).join("")}
      </div>
      <div class="wd-toggle-row" style="margin-top:12px;">
        ${[1, 2, 3, 4, 5].map((jsWd, idx) => `
          <button class="wd-toggle ${selectedDays.includes(jsWd) ? 'on' : ''}" data-wd="${jsWd}">${WD_LABELS[idx]}</button>
        `).join("")}
      </div>
      <div class="quota ${state.quotaWarning ? 'warn' : ''}">
        ${state.quotaWarning ? '每週最多申請 2 天，請先取消一天再選新的' : `已選 <b>${selectedDays.length}</b> / 2 天`}
      </div>

      ${quarterSummaryEntries.length > 0 ? `
        <div style="margin-top:14px; border-top:1px solid var(--border); padding-top:10px;">
          ${quarterSummaryEntries.map(([key, days]) => `
            <div class="quarter-summary">
              <span>${key}：週${days.map(wd => WD_LABELS[WD_JS_ORDER.indexOf(wd)]).join("、")}</span>
              <button class="btn danger" data-clear-quarter="${key}">清除</button>
            </div>
          `).join("")}
        </div>
      ` : ""}
    </div>

    <div class="card">
      <h3 class="section-h">登記休假</h3>
      <div class="row">
        <div>
          <label class="field-label">開始日期</label>
          <input type="date" id="leave-start" value="${state.leaveStart}" />
        </div>
        <div>
          <label class="field-label">結束日期（單日可留空）</label>
          <input type="date" id="leave-end" value="${state.leaveEnd}" />
        </div>
      </div>
      <label class="field-label" style="margin-top:12px;">時段（半天假可直接點選，整天假不用選）</label>
      <div class="q-toggle-row">
        <button class="wd-toggle" style="width:auto; padding:0 14px;" data-time-preset="full">整天</button>
        <button class="wd-toggle ${state.leaveStartTime === '09:00' && state.leaveEndTime === '12:00' ? 'on' : ''}" style="width:auto; padding:0 14px;" data-time-preset="am">上午（09:00-12:00）</button>
        <button class="wd-toggle ${state.leaveStartTime === '13:00' && state.leaveEndTime === '18:00' ? 'on' : ''}" style="width:auto; padding:0 14px;" data-time-preset="pm">下午（13:00-18:00）</button>
      </div>
      <div class="row" style="margin-top:12px;">
        <div style="flex:1; min-width:140px;">
          <label class="field-label">自訂開始時間</label>
          <input type="time" id="leave-start-time" value="${state.leaveStartTime}" style="width:100%;" />
        </div>
        <div style="flex:1; min-width:140px;">
          <label class="field-label">自訂結束時間</label>
          <input type="time" id="leave-end-time" value="${state.leaveEndTime}" style="width:100%;" />
        </div>
      </div>
      <button class="btn leave-btn" id="add-leave-btn" style="margin-top:12px;">新增休假</button>
    </div>

    <div class="card">
      <h3 class="section-h">登記公出</h3>
      <div class="row">
        <div>
          <label class="field-label">開始日期</label>
          <input type="date" id="business-start" value="${state.businessStart}" />
        </div>
        <div>
          <label class="field-label">結束日期（單日可留空）</label>
          <input type="date" id="business-end" value="${state.businessEnd}" />
        </div>
        <button class="btn business-btn" id="add-business-btn">新增公出</button>
      </div>
    </div>

    <div class="card">
      <h3 class="section-h">我的登記（未來 90 天）</h3>
      <div class="hint">臨時有事想取消，點右邊「取消」即可；取消居家後還想恢復，可以再點「恢復居家」</div>
      ${(() => {
        const combined = [
          ...upcoming.map(u => ({ date: u.date, text: `${statusLabel(u.status)}${u.time ? `（${u.time}）` : ''}`, action: "cancel" })),
          ...cancelledWfh.map(c => ({ date: c.date, text: "已取消居家", action: "restore" }))
        ].sort((a, b) => a.date.localeCompare(b.date));
        if (combined.length === 0) return '<div class="empty-note" style="margin-top:8px;">目前沒有安排。</div>';
        return `<div class="override-list">
          ${combined.map(item => `
            <div class="override-item">
              <span>${item.date}　${item.text}</span>
              ${item.action === "cancel"
                ? `<button class="btn danger" data-cancel-date="${item.date}">取消</button>`
                : `<button class="btn secondary" data-restore-date="${item.date}">恢復居家</button>`}
            </div>
          `).join("")}
        </div>`;
      })()}
    </div>
  `;
}

function bindEvents() {
  document.querySelectorAll(".tab").forEach(el => {
    el.onclick = () => { state.tab = el.dataset.tab; state.selectedDay = null; render(); };
  });
  document.querySelectorAll("[data-view]").forEach(el => {
    el.onclick = () => {
      state.calView = el.dataset.view;
      if (el.dataset.view === "today") state.dayCursor = startOfDay(new Date());
      state.selectedDay = null;
      render();
    };
  });
  document.querySelectorAll("[data-daynav]").forEach(el => {
    el.onclick = () => {
      const dir = parseInt(el.dataset.daynav, 10);
      const next = new Date(state.dayCursor);
      next.setDate(next.getDate() + dir);
      state.dayCursor = next;
      render();
    };
  });
  document.querySelectorAll("[data-nav]").forEach(el => {
    el.onclick = () => {
      const dir = parseInt(el.dataset.nav, 10);
      state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth() + dir, 1);
      state.selectedDay = null;
      render();
    };
  });
  document.querySelectorAll("[data-day]").forEach(el => {
    el.onclick = () => {
      state.selectedDay = state.selectedDay === el.dataset.day ? null : el.dataset.day;
      render();
    };
  });

  const newUserInput = document.getElementById("new-user-input");
  if (newUserInput) {
    newUserInput.oninput = (e) => { state.newUserInput = e.target.value; };
    newUserInput.onkeydown = (e) => { if (e.key === "Enter") document.getElementById("add-user-btn").click(); };
  }
  const addUserBtn = document.getElementById("add-user-btn");
  if (addUserBtn) {
    addUserBtn.onclick = async () => {
      const val = document.getElementById("new-user-input").value;
      await addManualMember(val);
      state.newUserInput = "";
    };
  }
  const pickUserSelect = document.getElementById("pick-user-select");
  if (pickUserSelect) {
    pickUserSelect.onchange = (e) => {
      state.currentUserId = e.target.value;
      state.currentUserName = state.memberData[e.target.value]?.displayName || e.target.value;
      render();
    };
  }

  document.querySelectorAll("[data-wd]").forEach(el => {
    el.onclick = async () => {
      await toggleQuarterlyDay(state.currentUserId, state.settingsYear, state.settingsQuarter, parseInt(el.dataset.wd, 10));
    };
  });

  const nameInput = document.getElementById("display-name-input");
  const saveNameBtn = document.getElementById("save-name-btn");
  if (saveNameBtn) {
    saveNameBtn.onclick = async () => { await updateDisplayName(state.currentUserId, nameInput.value); };
  }

  const yearSelect = document.getElementById("settings-year-select");
  if (yearSelect) {
    yearSelect.onchange = (e) => { state.settingsYear = parseInt(e.target.value, 10); state.quotaWarning = false; render(); };
  }
  document.querySelectorAll("[data-quarter]").forEach(el => {
    el.onclick = () => { state.settingsQuarter = parseInt(el.dataset.quarter, 10); state.quotaWarning = false; render(); };
  });
  document.querySelectorAll("[data-clear-quarter]").forEach(el => {
    el.onclick = async () => { await clearQuarter(state.currentUserId, el.dataset.clearQuarter); };
  });

  const leaveStart = document.getElementById("leave-start");
  const leaveEnd = document.getElementById("leave-end");
  if (leaveStart) leaveStart.oninput = (e) => { state.leaveStart = e.target.value; };
  if (leaveEnd) leaveEnd.oninput = (e) => { state.leaveEnd = e.target.value; };
  document.querySelectorAll("[data-time-preset]").forEach(el => {
    el.onclick = () => {
      const preset = el.dataset.timePreset;
      if (preset === "am") { state.leaveStartTime = "09:00"; state.leaveEndTime = "12:00"; }
      else if (preset === "pm") { state.leaveStartTime = "13:00"; state.leaveEndTime = "18:00"; }
      else { state.leaveStartTime = ""; state.leaveEndTime = ""; }
      render();
    };
  });

  const leaveStartTime = document.getElementById("leave-start-time");
  const leaveEndTime = document.getElementById("leave-end-time");
  if (leaveStartTime) leaveStartTime.oninput = (e) => { state.leaveStartTime = e.target.value; };
  if (leaveEndTime) leaveEndTime.oninput = (e) => { state.leaveEndTime = e.target.value; };
  const addLeaveBtn = document.getElementById("add-leave-btn");
  if (addLeaveBtn) {
    addLeaveBtn.onclick = async () => {
      await addLeaveRange(state.currentUserId, state.leaveStart, state.leaveEnd, state.leaveStartTime, state.leaveEndTime);
    };
  }

  const businessStart = document.getElementById("business-start");
  const businessEnd = document.getElementById("business-end");
  if (businessStart) businessStart.oninput = (e) => { state.businessStart = e.target.value; };
  if (businessEnd) businessEnd.oninput = (e) => { state.businessEnd = e.target.value; };
  const addBusinessBtn = document.getElementById("add-business-btn");
  if (addBusinessBtn) {
    addBusinessBtn.onclick = async () => { await addBusinessRange(state.currentUserId, state.businessStart, state.businessEnd); };
  }

  document.querySelectorAll("[data-cancel-date]").forEach(el => {
    el.onclick = async () => { await cancelDate(state.currentUserId, el.dataset.cancelDate); };
  });

  document.querySelectorAll("[data-restore-date]").forEach(el => {
    el.onclick = async () => { await restoreWfh(state.currentUserId, el.dataset.restoreDate); };
  });

  document.querySelectorAll("[data-remove-member]").forEach(el => {
    el.onclick = async () => { await removeMember(el.dataset.removeMember); };
  });
}

bootstrap();
</script>
